<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thomas Matthew M. Quintela | CBIA100</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f8ff;
            color: #0f172a;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
        }

        nav {
            padding: 30px 0;
            font-size: 24px;
            font-weight: bold;
            color: #2563eb;
            letter-spacing: 3px;
        }

        .hero {
            min-height: 430px;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 40px;

            background: linear-gradient(
                135deg,
                #1e40af,
                #2563eb,
                #60a5fa
            );

            color: white;

            border-radius: 25px;

            box-shadow:
                0 15px 40px
                rgba(37, 99, 235, 0.20);
        }

        .hero h1 {
            font-size: 58px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            color: #dbeafe;
        }

        .projects {
            padding: 85px 0;
        }

        .small-title {
            color: #3b82f6;
            font-size: 12px;
            letter-spacing: 4px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .projects h2 {
            font-size: 40px;
            color: #1e40af;
            margin-bottom: 35px;
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .card {
            background-color: white;

            border: 1px solid #dbeafe;

            border-radius: 22px;

            padding: 40px;

            box-shadow:
                0 8px 30px
                rgba(37, 99, 235, 0.08);

            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);

            box-shadow:
                0 18px 40px
                rgba(37, 99, 235, 0.15);

            border-color: #60a5fa;
        }

        .number {
            font-size: 12px;
            font-weight: bold;
            color: #60a5fa;
            letter-spacing: 2px;
        }

        .card h3 {
            font-size: 28px;
            margin: 15px 0 10px;
        }

        .card p {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .button {
            display: inline-block;

            background-color: #2563eb;
            color: white;

            text-decoration: none;
            font-weight: bold;

            padding: 13px 24px;

            border-radius: 30px;

            transition: 0.3s;
        }

        .button:hover {
            background-color: #1e40af;
        }

        footer {
            border-top: 1px solid #dbeafe;

            padding: 35px 0;

            color: #64748b;

            font-size: 13px;
        }

        @media (max-width: 700px) {

            .hero h1 {
                font-size: 39px;
            }

            .project-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>
</head>


<body>

<div class="container">


    <nav>
        TQ.
    </nav>


    <section class="hero">

        <div>

            <h1>
                Thomas Matthew M. Quintela
            </h1>

            <p>
                CBIA100 Project Compilation
            </p>

        </div>

    </section>


    <section class="projects">

        <div class="small-title">
            SELECTED WORK
        </div>

        <h2>
            My Projects
        </h2>


        <div class="project-grid">


            <!-- MODULE 2 -->

            <div class="card">

                <div class="number">
                    PROJECT 01
                </div>

                <h3>
                    Module 2 Activity
                </h3>

                <p>
                    View my Module 2 Activity website.
                </p>

                <a
                    href="module2.html"
                    class="button"
                >
                    Open Website →
                </a>

            </div>



            <!-- EPORTFOLIO -->

            <div class="card">

                <div class="number">
                    PROJECT 02
                </div>

                <h3>
                    Eportfolio
                </h3>

                <p>
                    View my complete Eportfolio project.
                </p>

                <a
                    href="QUINTELAJS%20ETY131%20%282%29/QUINTELAJS%20ETY131/thomas_eportfolio/eportfolio.html"
                    class="button"
                >
                    Open Website →
                </a>

            </div>


        </div>

    </section>


    <footer>
        © 2026 Thomas Matthew M. Quintela
    </footer>


</div>

</body>

</html>
