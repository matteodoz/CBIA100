<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thomas Matthew M. Quintela</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f9ff;
            color: #0f172a;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
        }

        nav {
            padding: 30px 0;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #2563eb;
        }

        .hero {
            min-height: 420px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-radius: 22px;
            background: linear-gradient(135deg, #2563eb, #60a5fa);
            color: white;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.18);
        }

        .hero h1 {
            font-size: 58px;
            margin-bottom: 20px;
        }

        .hero p {
            color: #dbeafe;
            font-size: 17px;
        }

        .projects {
            padding: 90px 0;
        }

        .projects h2 {
            font-size: 38px;
            margin-bottom: 35px;
            color: #1d4ed8;
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .card {
            background: white;
            border: 1px solid #dbeafe;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.08);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-7px);
            border-color: #60a5fa;
            box-shadow: 0 14px 30px rgba(37, 99, 235, 0.15);
        }

        .card span {
            color: #60a5fa;
            font-size: 12px;
            font-weight: bold;
        }

        .card h3 {
            font-size: 26px;
            margin: 15px 0 25px;
            color: #0f172a;
        }

        .card a {
            display: inline-block;
            text-decoration: none;
            color: white;
            background: #2563eb;
            padding: 12px 22px;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
        }

        .card a:hover {
            background: #1d4ed8;
        }

        footer {
            border-top: 1px solid #dbeafe;
            padding: 35px 0;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 700px) {
            .hero h1 {
                font-size: 40px;
            }

            .project-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <nav>
        TQ.
    </nav>

    <section class="hero">
        <div>
            <h1>Thomas Matthew M. Quintela</h1>
            <p>CBIA100 Student Portfolio</p>
        </div>
    </section>

    <section class="projects">

        <h2>Projects</h2>

        <div class="project-grid">

            <div class="card">
                <span>01</span>
                <h3>Module 2 Activity</h3>

                <a href="module2.html">
                    Open Website
                </a>
            </div>

            <div class="card">
                <span>02</span>
                <h3>Eportfolio</h3>

                <a href="eportfolio.html">
                    Open Website
                </a>
            </div>

        </div>

    </section>

    <footer>
        © 2026 Thomas Matthew M. Quintela
    </footer>

</div>

</body>
</html>
